# AcikBulucuAI ayarlari
# ANAHTAR: https://aistudio.google.com adresinden ucretsiz alinir (kredi karti gerekmez).
# Anahtari kimseye gosterme, sohbete/ekran goruntusune koyma. Bu dosya yapay zeka tarafindan da okunamaz.
# Alternatif: anahtari sunucunun ortam degiskenine GEMINI_API_KEY olarak da verebilirsin.
gemini:
  anahtar: "BURAYA_ANAHTARI_YAPISTIR"
  # Ucretsiz katmanda hangi modellerin acik oldugu zamanla degisir.
  # Calismazsa oyunda /ai modeller yaz, listeden birini sec.
  model: "gemini-3.5-flash-lite"
  zaman-asimi-sn: 60

ai:
  bekleme-sn: 3          # ayni kisi icin iki istek arasi
  onay-suresi-dk: 10     # /ai onayla icin sure
  max-tur: 4             # yapay zeka bir soruda en fazla kac kez dosya okuyabilir
  skript-otomatik-yenile: true
  skript-yenileme-komutu: "sk reload {script}"
  # Yapay zekanin onerse bile calistirilamayacak komutlar:
  yasakli-komutlar: [op, deop, stop, restart, reload, rl, rcon, execute, ai, yz, asistan, ban-ip, pardon-ip]
