# AcikBulucu ayarlari
otomatik-tarama:
  aktif: true
  dakika: 30
  # true yapilirsa sadece guvenli onarimlar kendiliginden uygulanir.
  # Her seferinde once yedek alinir (plugins/AcikBulucu/yedek/).
  otomatik-onar: false

# Eksik claim script'i otomatik uretilirken kullanilan degerler
claim-sablonu:
  ilk-fiyat: 5000
  ilk-blok: 1000
  genisletme-fiyat: 1000
  genisletme-blok: 250

# Spawn kontrolunda atlanacak dunyalar (adinda bu kelimeler gecenler). Nether/End zaten atlanir.
dunya-kontrol:
  haric-kelimeler: [skyblock, island, void]
