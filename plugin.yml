name: AcikBulucuAI
version: 2.2.0
main: tr.acikbulucuai.AcikBulucuAI
api-version: '1.20'
author: XSOLPE_YT
description: Gemini ile calisan yonetici asistani. Ayar/Skript onerir, yonetici onaylayinca yedek alip uygular.
softdepend: [Skript, AcikBulucu]
commands:
  ai:
    description: Yapay zeka sunucu asistani
    aliases: [yz, asistan]
    usage: /<command> <soru> | onayla | reddet | bekleyen | goster | geriyukle | modeller | sifirla | yenile
permissions:
  acikbulucuai.kullan:
    description: Yapay zekaya soru sormak ve onerileri gormek
    default: op
  acikbulucuai.onayla:
    description: Onerileri uygulamak ve geri almak
    default: op
